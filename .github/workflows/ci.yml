name: CI

# Master spec §60 "Production Deployment" places application deployment
# after migrations/env/db are ready; this workflow is the gate BEFORE any
# of that — it's what decides whether a commit is even deployable. Runs on
# every push and PR against main. Has not been executed anywhere (this
# sandbox has no network access to actions/checkout, actions/setup-node, or
# npm — see CLAUDE.md → Known Issues) — review it as a well-formed spec, not
# as a runtime-verified pipeline, same disclosure as the rest of this
# codebase.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: restaurant_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:devpassword@localhost:5432/restaurant_platform_test
      AUTH_SECRET: ci-test-secret-do-not-use-in-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CUSTOMER_AUTH_SECRET: ci-test-customer-secret-do-not-use-in-production-bbbbbbbbbbbbbbbb
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      # Applies the same migrations production would get via `npm run
      # db:migrate:deploy` (§60's "Database migrations" step) — CI runs
      # against a real, freshly-migrated schema rather than a mocked DB, so
      # a broken migration fails here before it ever reaches a deploy.
      - run: npx prisma migrate deploy
      - run: npm test -- --run
        env:
          # tests/setup.ts loads .env.test via dotenv; the job env above
          # already provides the same values directly, so no .env.test file
          # needs to exist in the CI checkout.
          CI: true

  build:
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, test]
    env:
      # See Dockerfile's builder-stage comment: `next build` performs no
      # database call, so these do not need to be real — instrumentation.ts's
      # validateEnv() only runs when a server actually boots, not at build
      # time — but Zod-typed env access elsewhere still expects the shape to
      # be present.
      DATABASE_URL: postgresql://postgres:devpassword@localhost:5432/restaurant_platform
      AUTH_SECRET: ci-build-secret-do-not-use-in-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CUSTOMER_AUTH_SECRET: ci-build-customer-secret-do-not-use-in-production-bbbbbbbbbbbbbbbb
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
